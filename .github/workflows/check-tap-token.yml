name: Check tap token

# Temporary diagnostic. Reports the shape of HOMEBREW_TAP_TOKEN and what the
# API says about it, without printing the token. Delete once the tap update
# works.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Describe the secret without revealing it
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "secret is empty or unset"
            exit 1
          fi

          # Length and prefix class only. A fine-grained token is
          # github_pat_… and roughly 90+ characters; a classic one is ghp_…
          # and 40. If this says 20-ish, something other than a token was
          # pasted.
          echo "length: ${#TOKEN}"

          case "$TOKEN" in
            github_pat_*) echo "shape: fine-grained (github_pat_)" ;;
            ghp_*)        echo "shape: classic (ghp_)" ;;
            gho_*|ghs_*)  echo "shape: OAuth/app token" ;;
            *)            echo "shape: UNRECOGNISED — does not start with a GitHub token prefix" ;;
          esac

          trimmed="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          if [ "${#trimmed}" -ne "${#TOKEN}" ]; then
            echo "WARNING: the value contains whitespace ($(( ${#TOKEN} - ${#trimmed} )) characters)"
          else
            echo "no stray whitespace"
          fi

      - name: Ask the API what the token can see
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          status() {
            curl -s -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          echo "GET /user                       -> $(status https://api.github.com/user)"
          echo "GET /repos/muhammetali/homebrew-tap -> $(status https://api.github.com/repos/muhammetali/homebrew-tap)"

          # The message, not the token, is what tells us which failure this is:
          # 401 Bad credentials means the token is not recognised at all;
          # 403/404 means it is valid but cannot see this repository.
          echo "last response message: $(jq -r '.message // "none"' /tmp/body 2>/dev/null)"
