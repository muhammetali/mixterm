name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      # `if:` can't reference `secrets` directly; mirror it into `env` so
      # the signing/notarization steps below can check for its presence.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      # A tagged build is something people download. Shipping it unsigned
      # is worse than not shipping it: macOS refuses to open an app with
      # no Developer ID, so the download is simply broken for everyone
      # who is not the person who built it.
      #
      # This exists because it already happened. v1.1.1 published a macOS
      # zip with `TeamIdentifier=not set` and no notarization ticket, and
      # every job in the run reported success — the signing steps below
      # are conditional, and a skipped step is a green step. It was found
      # only by downloading the published artefact and checking it.
      #
      # Untagged runs may still go unsigned: they exist to check that the
      # build compiles, and nobody installs them.
      - name: Require signing for a release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_APPLE_CERT != 'true' }}
        run: |
          echo "::error::APPLE_CERT_P12 is not set, so this tag would publish an unsigned macOS app that Gatekeeper refuses to open. See packaging/README.md for the certificate secrets."
          exit 1

      # Pinned to the exact version this project is developed/tested
      # against. dartssh2 2.14.0 (a direct dependency) fails to compile
      # on newer Dart SDKs — a real type-promotion bug in its own
      # sftp_client.dart, not something in this app's code — so floating
      # to whatever "stable" is on a given CI run isn't safe here.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Write Google OAuth secret
        # lib/services/google_oauth_secret.dart is gitignored (GitHub push
        # protection blocks any GOCSPX-shaped string in a commit) but is
        # imported by auth_service.dart, so it must exist before the app
        # compiles. Empty is fine if the secret isn't configured yet — the
        # build still succeeds, only Google Sign-In won't work at runtime.
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf "const String googleOAuthClientSecret = '%s';\n" "$GOOGLE_CLIENT_SECRET" > lib/services/google_oauth_secret.dart

      - run: flutter pub get
      - run: flutter build macos --release

      # Only attempts real Developer ID signing + notarization once the
      # certificate secrets exist (see packaging/README.md). Until then,
      # this step is skipped and the app stays ad-hoc signed, matching
      # the existing CODE_SIGN_IDENTITY = "-" project setting.
      - name: Codesign with Developer ID
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm cert.p12
          codesign --force --deep --options runtime \
            --sign "$APPLE_DEVELOPER_ID" \
            build/macos/Build/Products/Release/mixterm.app

      - name: Notarize
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Tilde is not expanded inside quotes, so the original
          # `> "~/private_keys/..."` wrote to a literal `./~` directory
          # that mkdir had not created, and the step died on its second
          # line. It had never run: signing was skipped, so notarization
          # was skipped with it, and the bug sat behind a condition that
          # was never true.
          KEY_DIR="$HOME/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/mixterm.app \
            mixterm-notarize.zip
          xcrun notarytool submit mixterm-notarize.zip \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple build/macos/Build/Products/Release/mixterm.app

      # Checks the app rather than the workflow. The guard at the top of
      # this job asserts the secret exists; this asserts the signing
      # actually took, which is the thing a user downloading the zip
      # depends on. Both are needed — v1.1.1 had every step green and
      # still shipped `TeamIdentifier=not set`.
      #
      # `spctl --assess` is deliberately not used: it reports "accepted"
      # on a machine where assessment is disabled, which is how the
      # unsigned build looked fine when first checked by hand.
      - name: Verify the app is signed and notarized
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          APP=build/macos/Build/Products/Release/mixterm.app

          if codesign -dv "$APP" 2>&1 | grep -q 'TeamIdentifier=not set'; then
            echo "::error::the app is ad-hoc signed — Gatekeeper will refuse to open it"
            exit 1
          fi

          if ! xcrun stapler validate "$APP"; then
            echo "::error::no notarization ticket is stapled to the app"
            exit 1
          fi

          codesign -dv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier'

      - name: Package .zip for Homebrew
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent mixterm.app "$GITHUB_WORKSPACE/mixterm-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mixterm-macos
          path: mixterm-macos.zip

  build-linux-deb:
    # 22.04 rather than latest, deliberately. A Flutter Linux binary links
    # against the glibc of the host it was built on, so building here makes
    # the package installable on 22.04 and 24.04 alike; building on 24.04
    # silently drops everything older. dpkg-shlibdeps in build_deb.sh then
    # states whatever floor this host actually implies, so the two cannot
    # disagree.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version this project is developed/tested
      # against. dartssh2 2.14.0 (a direct dependency) fails to compile
      # on newer Dart SDKs — a real type-promotion bug in its own
      # sftp_client.dart, not something in this app's code — so floating
      # to whatever "stable" is on a given CI run isn't safe here.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev patchelf

      - name: Write Google OAuth secret
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf "const String googleOAuthClientSecret = '%s';\n" "$GOOGLE_CLIENT_SECRET" > lib/services/google_oauth_secret.dart

      - run: flutter pub get
      - run: bash scripts/build_deb.sh

      # Building a .deb proves almost nothing about it. This installs the
      # thing and asks lintian what Debian thinks of it, which is how the
      # missing copyright file would have been noticed without someone
      # running lintian by hand after an install.
      #
      # Errors fail the build; warnings are printed. A Flutter app ships its
      # own libraries and no man page, so it will always have warnings, and
      # failing on those would just teach everyone to ignore this step.
      - name: Check the package installs and what lintian says
        run: |
          sudo apt-get install -y lintian
          deb="$(ls build/deb/*.deb)"

          echo "::group::declared dependencies"
          dpkg-deb -f "$deb" Depends
          echo "::endgroup::"

          sudo apt-get install -y "./$deb"
          dpkg -s mixterm | grep -E '^(Status|Version|Depends)'
          test -x /usr/bin/mixterm || test -L /usr/bin/mixterm
          test -f /usr/share/doc/mixterm/copyright
          test -f /usr/share/doc/mixterm/changelog.gz

          # No build-host paths should have survived into the installed
          # libraries. lintian catches this too, but asserting it here says
          # what went wrong rather than leaving it in a wall of tags.
          if grep -rlI '/home/runner' /usr/lib/mixterm/ 2>/dev/null; then
            echo "::error::build-host paths are present in the installed files"
            exit 1
          fi

          # Start it, for the same reason the snap job does: installing
          # proves nothing about running, and the library the app opens at
          # runtime is invisible to dpkg-shlibdeps. apt has just resolved the
          # declared dependencies, so this also checks that the declaration
          # is sufficient rather than merely present.
          sudo apt-get install -y xvfb
          set +e
          output="$(xvfb-run -a timeout 30 mixterm 2>&1)"
          status=$?
          set -e

          echo "::group::application output"
          echo "$output"
          echo "::endgroup::"

          if echo "$output" | grep -qE "cannot open shared object|core dumped|Aborted|GLIBC_|Couldn't open"; then
            echo "::error::the package installs and then fails to start"
            exit 1
          fi

          if [ "$status" -ne 124 ]; then
            echo "::error::the app exited on its own with status $status"
            exit 1
          fi

          echo "ran for 30s without failing"

          echo "::group::lintian"
          lintian --no-tag-display-limit "$deb" || true
          echo "::endgroup::"

          # Two error classes are inherent to shipping a Flutter build rather
          # than defects in this package, and gating on them would only make
          # the step something to route around:
          #
          #   embedded-library — the engine statically links freetype, libpng
          #     and libjpeg. Changing that means rebuilding Flutter's engine.
          #   unstripped-binary-or-object — libapp.so is an AOT snapshot;
          #     stripping the shipped libraries risks the app for tidiness.
          #
          # Everything else still fails, including the two this caught the
          # first time it ran: build-host paths left in RUNPATH, and a
          # missing changelog.
          if lintian --fail-on error --no-tag-display-limit \
               --suppress-tags embedded-library,unstripped-binary-or-object \
               "$deb"; then
            echo "no lintian errors"
          else
            echo "::error::lintian reported errors above"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mixterm-deb
          path: build/deb/*.deb

  build-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pinned build as build-linux-deb, reused here (see
      # snap/snapcraft.yaml's `dump` plugin) so the snap doesn't depend
      # on a snapcraft plugin fetching its own, unpinned Flutter SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Write Google OAuth secret
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf "const String googleOAuthClientSecret = '%s';\n" "$GOOGLE_CLIENT_SECRET" > lib/services/google_oauth_secret.dart

      - run: flutter pub get
      - run: flutter build linux --release

      # Built in a container, not on the runner.
      #
      # `--destructive-mode` builds against the host's apt, which is how a
      # core22 snap ended up carrying 24.04 libraries and refusing to start.
      # It also installs the gnome extension's SDK onto the runner, which has
      # already produced a libunistring conflict here once. A container makes
      # the base and the staged packages the same thing by construction.
      - uses: snapcore/action-build@v1.3.0
        id: snapcraft

      # Start it. Nothing above can see a dlopen failure: ldd reports what an
      # ELF links against, and the Flutter engine opens its GL stack at
      # runtime, so 1.1.5 and 1.1.7 both passed a library check and then died
      # with "Couldn't open libEGL.so.1: cannot open shared object file".
      #
      # Three releases were published broken because the pipeline never ran
      # what it built. This is the check that would have caught all three.
      - name: Check the snap starts
        run: |
          sudo apt-get install -y xvfb

          # The gnome extension takes GTK, GL and themes from content snaps.
          # Installing a local snap does not pull those in, so without them
          # the app would fail here for a reason that has nothing to do with
          # the package.
          sudo snap install gnome-46-2404 || true
          sudo snap install mesa-2404 || true
          sudo snap install gtk-common-themes || true

          sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"

          echo "::group::interfaces"
          snap connections mixterm || true
          echo "::endgroup::"

          # The launcher icon. A desktop file can name an icon that is not
          # there and nothing complains — the menu just shows something else,
          # which is how 1.1.8 ended up displaying the icon left behind by the
          # .deb it replaced. Read the path the app declares and check it
          # exists inside the snap.
          desktop=/snap/mixterm/current/usr/share/applications/com.mixterm.mixterm.desktop
          icon="$(sed -n 's|^Icon=||p' "$desktop")"
          echo "declared icon: $icon"

          case "$icon" in
            '${SNAP}'/*)
              resolved="/snap/mixterm/current/${icon#'${SNAP}'/}"
              test -f "$resolved" || {
                echo "::error::the desktop file points at $icon, which is not in the snap"
                exit 1
              }
              echo "icon present: $resolved"
              ;;
            /*)
              test -f "$icon" || { echo "::error::$icon does not exist"; exit 1; }
              ;;
            *)
              echo "::error::Icon=$icon names a theme entry; a snap's own icon tree is not on the theme search path, so the launcher will show something else"
              exit 1
              ;;
          esac

          set +e
          output="$(xvfb-run -a timeout 30 mixterm 2>&1)"
          status=$?
          set -e

          echo "::group::application output"
          echo "$output"
          echo "::endgroup::"

          if echo "$output" | grep -qE "cannot open shared object|core dumped|Aborted|GLIBC_|Couldn't open"; then
            echo "::error::the snap installs and then fails to start"
            exit 1
          fi

          # A window-bearing app should still be alive when the timeout fires,
          # which kills it with 124. Any other status means it gave up.
          if [ "$status" -ne 124 ]; then
            echo "::error::the app exited on its own with status $status"
            exit 1
          fi

          echo "ran for 30s without failing"

      - uses: actions/upload-artifact@v4
        with:
          name: mixterm-snap
          path: ${{ steps.snapcraft.outputs.snap }}

  create-release:
    needs: [build-macos, build-linux-deb, build-snap]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Re-runnable. A release that has to be rebuilt — because a build was
      # wrong, or because a secret was missing the first time — should be able
      # to replace its assets instead of failing with "release already
      # exists". `--generate-notes` stays on the create path only, so notes
      # written by hand after the fact survive a rebuild.
      - run: |
          assets=(
            artifacts/mixterm-macos/mixterm-macos.zip
            artifacts/mixterm-deb/*.deb
            artifacts/mixterm-snap/*.snap
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  # The Homebrew cask pins a version and a sha256, so a release nobody
  # copies into the tap is a release `brew upgrade` never offers — and it
  # says "already up to date" while doing it, which is the quiet kind of
  # wrong this pipeline has produced twice already. So it runs here, and it
  # fails rather than skips.
  update-homebrew-tap:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAP_REPOSITORY: muhammetali/homebrew-tap
      CASK_PATH: Casks/mixterm.rb
      # `if:` cannot reference `secrets`, same as in build-macos above.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Require the tap token
        if: ${{ env.HAS_TAP_TOKEN != 'true' }}
        run: |
          echo "::error::HOMEBREW_TAP_TOKEN is not set, so the Homebrew cask would keep pointing at the previous release. Create a fine-grained token with Contents: write on ${TAP_REPOSITORY} and add it as a repository secret."
          exit 1

      # GITHUB_TOKEN is scoped to this repository and cannot write to the
      # tap, hence the separate token.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Point the cask at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"

          # Hash what was actually published, not what was built: the cask's
          # url points at this asset, so this is the only file whose digest
          # is the right answer.
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern mixterm-macos.zip \
            --dir .
          sha="$(sha256sum mixterm-macos.zip | cut -d' ' -f1)"

          cask="tap/$CASK_PATH"
          grep -q '^  version "' "$cask" || { echo "::error::no version line in $cask"; exit 1; }
          grep -q '^  sha256 "' "$cask"  || { echo "::error::no sha256 line in $cask"; exit 1; }

          sed -i -E "s|^  version \".*\"|  version \"$version\"|" "$cask"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$cask"

          # Prove the edit landed rather than trusting sed's exit status,
          # which is 0 whether or not anything matched.
          grep -qF "\"$version\"" "$cask" || { echo "::error::version not written"; exit 1; }
          grep -qF "\"$sha\"" "$cask"     || { echo "::error::sha256 not written"; exit 1; }

      - name: Commit to the tap
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Cask already describes $TAG; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update MixTerm to ${TAG#v}"
          git push

  # Publishes to the Snap Store, so `snap install mixterm` gets the release
  # rather than only whoever finds the .snap file on this page.
  #
  # Fails rather than skips without credentials, for the same reason as the
  # signing and tap guards above: a skipped step is a green step, and a
  # release that quietly does not reach the store is one nobody notices for
  # months.
  publish-snap:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # `if:` cannot reference `secrets`.
      HAS_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - name: Require store credentials
        if: ${{ env.HAS_STORE_CREDENTIALS != 'true' }}
        run: |
          echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not set, so this release would not reach the Snap Store. Produce it with 'snapcraft export-login --snaps=mixterm --acls package_access,package_push,package_update,package_release' and add it as a repository secret."
          exit 1

      - name: Fetch the snap from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.snap' \
            --dir .

          # One snap, and the name has to carry the version being released —
          # the manifest derives it from pubspec, and a mismatch here would
          # mean the store publishing something other than this tag.
          count="$(ls -1 ./*.snap | wc -l)"
          [ "$count" -eq 1 ] || { echo "::error::expected exactly one .snap, found $count"; exit 1; }

          snap="$(ls ./*.snap)"
          case "$snap" in
            *_"${TAG#v}"_*) echo "snap=$snap" >> "$GITHUB_ENV" ;;
            *) echo "::error::$snap does not carry version ${TAG#v}"; exit 1 ;;
          esac

      - uses: snapcore/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ env.snap }}
          release: stable
