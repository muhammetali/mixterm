name: mixterm
description: "Professional SSH/SFTP client for Linux, macOS and Windows"
publish_to: 'none'
version: 1.1.8+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SSH/SFTP
  dartssh2: ^2.13.0

  # Terminal (forked for per-cell selection invert)
  xterm:
    path: packages/xterm

  # Google Auth & Drive
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  http: ^1.6.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.7
  pointycastle: ^3.9.1  # Kept at 3.x for encrypt compatibility

  # State Management
  provider: ^6.1.5

  # Storage
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5

  # Utils
  uuid: ^4.5.2
  intl: ^0.20.2
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  desktop_drop: ^0.7.0
  cross_file: ^0.3.5+2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    # The OFL requires the licence to travel with the fonts. They are
    # registered with Flutter's LicenseRegistry at startup (see main.dart)
    # so they appear in the app's own licence page rather than only
    # existing as files nobody reads.
    - assets/fonts/LICENSES/

  fonts:
    # Interface typeface. Bundled rather than left to the platform default
    # so the interface renders identically everywhere — the design tokens
    # were measured against one rendering, and on Linux the system default
    # is whatever the distribution happens to ship. A variable font, so a
    # single file covers every weight the type scale asks for.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

    # Terminal typefaces, offered in Settings. The variable builds replace
    # four static weight files each: smaller on disk and every weight
    # available rather than the four that happened to be bundled.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Variable.ttf
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    - family: UbuntuSansMono
      fonts:
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/UbuntuMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/UbuntuMono-Bold.ttf
          weight: 700
    # No variable build is published for Cascadia, so its static weights
    # stay. It is the largest family bundled by a wide margin.
    - family: CascadiaMono
      fonts:
        - asset: assets/fonts/CascadiaMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/CascadiaMono-Light.ttf
          weight: 300
        - asset: assets/fonts/CascadiaMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/CascadiaMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CascadiaMono-Bold.ttf
          weight: 700
