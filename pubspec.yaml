name: mixterm
description: "Professional SSH/SFTP client for Linux, macOS and Windows"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SSH/SFTP
  dartssh2: ^2.13.0

  # Terminal (forked for per-cell selection invert)
  xterm:
    path: packages/xterm

  # Google Auth & Drive
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  http: ^1.6.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.7
  pointycastle: ^3.9.1  # Kept at 3.x for encrypt compatibility

  # State Management
  provider: ^6.1.5

  # Storage
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5

  # Utils
  uuid: ^4.5.2
  intl: ^0.20.2
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  desktop_drop: ^0.7.0
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Light.ttf
          weight: 300
        - asset: assets/fonts/FiraCode-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraCode-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Light.otf
          weight: 300
        - asset: assets/fonts/SourceCodePro-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceCodePro-Medium.otf
          weight: 500
        - asset: assets/fonts/SourceCodePro-Bold.otf
          weight: 700
    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/UbuntuMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/UbuntuMono-Bold.ttf
          weight: 700
    - family: UbuntuSansMono
      fonts:
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
          weight: 200
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
          weight: 300
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
          weight: 700
    - family: CascadiaMono
      fonts:
        - asset: assets/fonts/CascadiaMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/CascadiaMono-Light.ttf
          weight: 300
        - asset: assets/fonts/CascadiaMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/CascadiaMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CascadiaMono-Bold.ttf
          weight: 700
