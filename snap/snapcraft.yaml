name: mixterm
# Must match the distribution the snap is built on. CI builds with
# `snapcraft --destructive-mode` on ubuntu-latest, so stage-packages come
# straight from that host's apt — 24.04, glibc 2.39. Declaring core22
# gave the snap a 2.35 runtime instead, and it installed cleanly, passed
# the store's review and then refused to start:
#
#   libgtk-3.so.0: version `GLIBC_2.38' not found
#
# snapd ships the base itself, so core24 costs nothing in reach: the snap
# still runs on 22.04 hosts.
base: core24
# Read from pubspec.yaml at build time rather than written here. It was
# hardcoded, and the 1.1.0 release shipped a snap still calling itself
# 1.0.0 — the .deb was correct because its build script already derives the
# version from pubspec. One number, one home.
adopt-info: mixterm
summary: Professional SSH/SFTP client
description: |
  MixTerm is a professional SSH/SFTP client with multi-tab terminal
  sessions, a visual SFTP file browser, AES-256 encrypted credential
  storage, and Google Drive cloud sync.
# SPDX identifier, shown on the store listing. Only meaningful now that
# the repository actually carries a LICENSE file.
license: MIT
grade: stable
confinement: strict

apps:
  mixterm:
    command: usr/bin/mixterm

    # The gnome extension, not a hand-picked library list.
    #
    # 1.1.5 and 1.1.7 both installed and then died with
    #
    #   Couldn't open libEGL.so.1: cannot open shared object file
    #
    # because the Flutter engine dlopens its GL stack at runtime rather than
    # linking it. Adding libegl1 to stage-packages would move the failure
    # along to the next dlopen — and mesa staged inside a snap fights the
    # host's drivers anyway. The extension exists for exactly this: it wires
    # in the GNOME runtime and the graphics-core24 content snap, so GL, GTK,
    # themes, fonts and icons all come from outside the snap and match the
    # host.
    #
    # It also supplies the desktop, desktop-legacy, gsettings, opengl,
    # wayland and x11 plugs, which is why they are no longer listed here.
    extensions:
      - gnome

    plugs:
      - network
      - network-bind
      - home
      - removable-media
    desktop: usr/share/applications/com.mixterm.mixterm.desktop

parts:
  mixterm:
    override-pull: |
      craftctl default
      craftctl set version="$(grep '^version:' "${CRAFT_PROJECT_DIR}/pubspec.yaml" | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')"
    # Packages the Flutter Linux bundle built by a prior CI step (with a
    # pinned Flutter version — see release.yml) rather than letting a
    # snapcraft plugin fetch/build Flutter itself. The `flutter` plugin's
    # own git-clone-based SDK provisioning both floats to whatever
    # "stable" currently is (see the dartssh2 compile-bug pin note in
    # release.yml) and, combined with the `gnome` extension, hit a
    # destructive-mode library conflict (`libunistring.so.2` mismatch)
    # on GitHub's runners. Reusing one already-built, already-tested
    # bundle across deb/snap/PPA avoids all of that.
    plugin: dump
    # Relative to the project root (where `snapcraft` is invoked from in
    # CI), not to this snap/ directory.
    source: build/linux/x64/release/bundle
    # No stage-packages. GTK arrives through the gnome extension's runtime,
    # and staging a second copy is how the glibc mismatch got in: packages
    # pulled from the build host, resolved against a different base.
    override-build: |
      craftctl default
      # Move the dumped bundle's own top-level entries into
      # usr/lib/mixterm/, naming them rather than using a blanket
      # `organize: "*"`: that also matches any usr/ tree a future
      # stage-packages would extract here, and fails trying to move usr/
      # into usr/lib/mixterm/usr/.
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/mixterm"
      mv "$CRAFT_PART_INSTALL"/mixterm "$CRAFT_PART_INSTALL"/lib "$CRAFT_PART_INSTALL"/data \
        "$CRAFT_PART_INSTALL/usr/lib/mixterm/"
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      ln -sf ../lib/mixterm/mixterm "$CRAFT_PART_INSTALL/usr/bin/mixterm"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      # Exec=mixterm (the bare command name) is correct as-is for a snap
      # desktop file — snapd rewrites it to route through `snap run`.
      #
      # Icon is not. `Icon=mixterm` names an icon *theme* entry, and a snap's
      # own usr/share/icons tree is not on the system's theme search path, so
      # the name resolves to nothing and the launcher shows whatever it can
      # find — for 1.1.8 on a machine that had previously held the .deb, the
      # old icon left behind by it. Pointing at a file inside the snap is
      # what makes the launcher show this app's icon; snapd expands ${SNAP}
      # to the mount point when it exports the desktop file.
      sed 's|^Icon=mixterm$|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/mixterm.png|' \
        "$CRAFT_PROJECT_DIR/linux/runner/mixterm.desktop" \
        > "$CRAFT_PART_INSTALL/usr/share/applications/com.mixterm.mixterm.desktop"

      # An Icon line that still names the theme entry means the sed above
      # stopped matching, which would be invisible until someone looked at
      # their application menu.
      if grep -q '^Icon=mixterm$' \
          "$CRAFT_PART_INSTALL/usr/share/applications/com.mixterm.mixterm.desktop"; then
        echo "error: the desktop file still points at a theme icon name" >&2
        exit 1
      fi
      for size in 16 24 32 48 64 128 256 512; do
        dir="$CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps"
        mkdir -p "$dir"
        cp "$CRAFT_PROJECT_DIR/assets/icons/linux/mixterm_${size}.png" "$dir/mixterm.png"
      done
