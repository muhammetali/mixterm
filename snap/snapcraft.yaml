name: mixterm
base: core22
version: '1.0.0'
summary: Professional SSH/SFTP client
description: |
  MixTerm is a professional SSH/SFTP client with multi-tab terminal
  sessions, a visual SFTP file browser, AES-256 encrypted credential
  storage, and Google Drive cloud sync.
grade: stable
confinement: strict

apps:
  mixterm:
    command: usr/bin/mixterm
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
    desktop: usr/share/applications/com.mixterm.mixterm.desktop

parts:
  mixterm:
    # Packages the Flutter Linux bundle built by a prior CI step (with a
    # pinned Flutter version — see release.yml) rather than letting a
    # snapcraft plugin fetch/build Flutter itself. The `flutter` plugin's
    # own git-clone-based SDK provisioning both floats to whatever
    # "stable" currently is (see the dartssh2 compile-bug pin note in
    # release.yml) and, combined with the `gnome` extension, hit a
    # destructive-mode library conflict (`libunistring.so.2` mismatch)
    # on GitHub's runners. Reusing one already-built, already-tested
    # bundle across deb/snap/PPA avoids all of that.
    plugin: dump
    # Relative to the project root (where `snapcraft` is invoked from in
    # CI), not to this snap/ directory.
    source: build/linux/x64/release/bundle
    organize:
      "*": usr/lib/mixterm/
    stage-packages:
      - libgtk-3-0
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      ln -sf ../lib/mixterm/mixterm "$CRAFT_PART_INSTALL/usr/bin/mixterm"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      sed 's|Exec=mixterm|Exec=mixterm|' \
        "$CRAFT_PROJECT_DIR/linux/runner/mixterm.desktop" \
        > "$CRAFT_PART_INSTALL/usr/share/applications/com.mixterm.mixterm.desktop"
      for size in 16 24 32 48 64 128 256 512; do
        dir="$CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps"
        mkdir -p "$dir"
        cp "$CRAFT_PROJECT_DIR/assets/icons/linux/mixterm_${size}.png" "$dir/mixterm.png"
      done
